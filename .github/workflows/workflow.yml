name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on: [push]

jobs:
    artefact_afpa:
        name: Artefact AFPA – Init Workflow
        runs-on: ubuntu-latest
        steps:
            - run: echo "Workflow déclenché par un événement : ${{ github.event_name }}"
            - run: echo "Runner utilisé : ${{ runner.os }}"
            - run: echo "Branche : ${{ github.ref }}"
            - run: echo "Repository : ${{ github.repository }}"

    build:
        name: Build and analyze
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: 25
                  distribution: 'zulu'

            - name: Cache SonarQube packages
              uses: actions/cache@v4
              with:
                  path: ~/.sonar/cache
                  key: ${{ runner.os }}-sonar
                  restore-keys: ${{ runner.os }}-sonar

            - name: Cache Maven packages
              uses: actions/cache@v4
              with:
                  path: ~/.m2
                  key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                  restore-keys: ${{ runner.os }}-m2

            - name: Build and analyze
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Cyril-Ugolini_HarmoGestion_API_Fork


    teams_notification:
        name: MS Teams Notification
        runs-on: ubuntu-latest
        needs: build
        if: always()
        steps:
            - name: Send notification to Teams
              run: |
                  curl -H "Content-Type: application/json" \
                       -d "{
                         \"text\": \"Build terminé pour HarmoGestion API — statut : ${{ job.status }}\"
                       }" \
                       ${{ secrets.MS_TEAMS_WEBHOOK_URI }}

