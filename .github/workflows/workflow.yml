name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on: [push]

jobs:

    artefact_afpa:
        name: Artefact AFPA – Init Workflow
        runs-on: ubuntu-latest
        steps:
            - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
            - run: echo "This job is running on a ${{ runner.os }} server hosted by GitHub."
            - run: echo "Your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

    build:
        name: Build and analyze
        runs-on: ubuntu-latest
        needs: artefact_afpa
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: 25
                  distribution: 'zulu'

            - name: Cache SonarQube packages
              uses: actions/cache@v4
              with:
                  path: ~/.sonar/cache
                  key: ${{ runner.os }}-sonar
                  restore-keys: ${{ runner.os }}-sonar

            - name: Cache Maven packages
              uses: actions/cache@v4
              with:
                  path: ~/.m2
                  key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                  restore-keys: ${{ runner.os }}-m2

            - name: Build and analyze
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Cyril-Ugolini_HarmoGestion_API_Fork

            - name: Build Docker image
              run: docker build -t harmo-api:${{ github.sha }} .

    Team_Notifications:
        name: MS Teams Notification
        runs-on: ubuntu-latest
        needs: build
        if: always()
        steps:
            - uses: jdcargile/ms-teams-notification@v1.4
              with:
                  github-token: ${{ github.token }}
                  ms-teams-webhook-uri: ${{ secrets.MS_TEAMS_WEBHOOK_URI }}
                  notification-summary: Deploiement finished !
                  notification-color: 17a2b8
                  timezone: Paris
                  verbose-logging: true