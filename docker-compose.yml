name: harmo-gestion

services:
    db:
        image: mysql:8.3.0
        volumes:
            - db_data:/var/lib/mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: harmogestion
            MYSQL_USER: exempleuser
            MYSQL_PASSWORD: exemplepass

    harmo-api:
        depends_on:
            - db
        build: .
        ports:
            - "8081:8080"
        restart: always
        environment:
            SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/harmogestion
            SPRING_DATASOURCE_USERNAME: exempleuser
            SPRING_DATASOURCE_PASSWORD: exemplepass
            SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
    db_data: